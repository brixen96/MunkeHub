<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MunkeHub — Munkeklubben</title>
    <!-- Inline SVG favicon (the guild crest) — no file, no 404 -->
    <link rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%2314131a'/%3E%3Ctext y='.9em' x='50' font-size='72' text-anchor='middle'%3E%F0%9F%90%92%3C/text%3E%3C/svg%3E" />
    <!-- Wowhead tooltip widget — same setup as armorywowforever.com:
         plain links, rich item tooltip on hover, no link restyling.
         Must load before the app bundle (synchronous, like the armory). -->
    <script>
      window.whTooltips = { colorLinks: false, iconizeLinks: false, renameLinks: false };
    </script>
    <script src="https://wow.zamimg.com/js/tooltips.js"></script>
  </head>
  <body>
    <noscript>
      <strong>MunkeHub needs JavaScript enabled.</strong>
    </noscript>
    <div id="app"></div>
  </body>
</html>

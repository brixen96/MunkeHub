# Rate limit: 5 req/s per IP on the API proxy, burst 20
limit_req_zone $binary_remote_addr zone=apilimit:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    # Security headers (plain-HTTP deployment, friends-only)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: let Vue Router handle unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Admin token minting is LAN-only (direct to :4711) — never through the
    # internet-facing web port, even though it needs the admin token header.
    location = /api/v1/tokens {
        default_type application/json;
        return 403 '{"error":"forbidden: mint tokens via the LAN API port"}';
    }

    # Health/version check (used by the footer version display)
    location = /health {
        proxy_pass http://munkehub-api:8080/health;
        proxy_set_header Host $host;
    }

    # Proxy API calls to the api container (same Docker network).
    # Burst raised to 40: opening a character row fires ~20 parallel
    # requests (19 gear icons + model data) on a cold browser cache.
    location /api/ {
        limit_req zone=apilimit burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://munkehub-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3D model assets: the wowhead viewer fires ~60 parallel requests on a
    # cold cache (meta JSON, m2 meshes, textures). Sustained rate stays 5r/s.
    location /api/v1/mv/ {
        limit_req zone=apilimit burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://munkehub-api:8080/api/v1/mv/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
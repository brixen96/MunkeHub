# MunkeHub — Portainer Stack
# Portainer → Stacks → Add stack → paste this → Deploy the stack
# Private: Munkeklubben only.
#   Website: port 4712 (port-forward this for the guild)
#   API:     port 4711 (internal/diagnostics, no need to forward)
# Data lives on the NVMe share next to the WoW server:
#   /mnt/NVMEShare/NVMEShare/gameservers/wow-munkeklubben/munkehub/data/

services:
  api:
    image: brix1337/munkehub-api:latest
    container_name: munkehub-api
    ports:
      - "4711:8080"
    environment:
      - MUNKEHUB_PORT=8080
      - MUNKEHUB_DB=/data/munkehub.db
      # Item icon cache (lazy-fetched from zamimg, persisted across restarts)
      - MUNKEHUB_ICONS=/data/icons
      # Admin token: used to mint per-member tokens (POST /api/v1/tokens).
      # CHANGE THIS to your own secret before deploying!
      - MUNKEHUB_ADMIN_TOKEN=LEsfAcdEfTMU1BMzx15quKliFbEoWJ6SOzEaLEDakeeYBIKexUfwwQqb2zSZbrhk
    volumes:
      - /mnt/NVMEShare/NVMEShare/gameservers/wow-munkeklubben/munkehub/data:/data
    restart: unless-stopped

  web:
    image: brix1337/munkehub-web:latest
    container_name: munkehub-web
    ports:
      - "4712:80"
    depends_on:
      - api
    restart: unless-stopped